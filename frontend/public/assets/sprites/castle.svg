<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Castle Base -->
  <rect x="10" y="80" width="100" height="75" fill="#2d1b69" rx="4"/>
  <!-- Castle Gate -->
  <rect x="44" y="115" width="32" height="40" fill="#0a0a12" rx="12 12 0 0"/>
  <!-- Gate arch detail -->
  <rect x="48" y="119" width="24" height="30" fill="#12091e" rx="8 8 0 0"/>
  <!-- Gate rivets -->
  <circle cx="50" cy="128" r="2" fill="#8147FF" opacity="0.6"/>
  <circle cx="70" cy="128" r="2" fill="#8147FF" opacity="0.6"/>
  <!-- Left Tower -->
  <rect x="5" y="55" width="30" height="100" fill="#3a2280" rx="3"/>
  <!-- Left Tower Crenellations -->
  <rect x="5" y="45" width="6" height="16" fill="#4a2fa0" rx="1"/>
  <rect x="15" y="45" width="6" height="16" fill="#4a2fa0" rx="1"/>
  <rect x="25" y="45" width="6" height="16" fill="#4a2fa0" rx="1"/>
  <!-- Left Tower Window -->
  <rect x="14" y="70" width="12" height="18" fill="#8147FF" rx="6 6 0 0" opacity="0.9"/>
  <rect x="15" y="71" width="10" height="16" fill="#c084fc" rx="5 5 0 0" opacity="0.5"/>
  <!-- Right Tower -->
  <rect x="85" y="55" width="30" height="100" fill="#3a2280" rx="3"/>
  <!-- Right Tower Crenellations -->
  <rect x="85" y="45" width="6" height="16" fill="#4a2fa0" rx="1"/>
  <rect x="95" y="45" width="6" height="16" fill="#4a2fa0" rx="1"/>
  <rect x="105" y="45" width="6" height="16" fill="#4a2fa0" rx="1"/>
  <!-- Right Tower Window -->
  <rect x="94" y="70" width="12" height="18" fill="#8147FF" rx="6 6 0 0" opacity="0.9"/>
  <rect x="95" y="71" width="10" height="16" fill="#c084fc" rx="5 5 0 0" opacity="0.5"/>
  <!-- Main Body Crenellations -->
  <rect x="35" y="68" width="10" height="16" fill="#4a2fa0" rx="1"/>
  <rect x="50" y="68" width="10" height="16" fill="#4a2fa0" rx="1"/>
  <rect x="65" y="68" width="10" height="16" fill="#4a2fa0" rx="1"/>
  <rect x="80" y="68" width="10" height="16" fill="#4a2fa0" rx="1"/>
  <!-- Flag Pole Left -->
  <line x1="20" y1="44" x2="20" y2="15" stroke="#8147FF" stroke-width="2"/>
  <polygon points="20,15 38,22 20,28" fill="#8147FF" opacity="0.9"/>
  <!-- Flag Pole Right -->
  <line x1="100" y1="44" x2="100" y2="15" stroke="#8147FF" stroke-width="2"/>
  <polygon points="100,15 118,22 100,28" fill="#8147FF" opacity="0.9"/>
  <!-- Ground -->
  <rect x="0" y="148" width="120" height="12" fill="#1a0f3d" rx="4"/>
  <!-- Window glow effect -->
  <ellipse cx="20" cy="79" rx="12" ry="6" fill="#8147FF" opacity="0.2"/>
  <ellipse cx="100" cy="79" rx="12" ry="6" fill="#8147FF" opacity="0.2"/>
</svg>
